<title>MARROW load smoke test</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; background: #14110e; color: #e8dfc9; padding: 16px; }
  .ok { color: #7fbf7f; } .bad { color: #ff8a8a; } .warn { color: #d9b45b; }
  pre { white-space: pre-wrap; margin: 2px 0 10px; }
  h2 { font-size: 14px; margin: 16px 0 4px; color: #8a6f3c; }
</style>
<h1>MARROW load smoke test</h1>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
<script>
/*
  Catches the class of failure that leaves a system silently unloaded in Foundry: an error
  thrown while the ES module graph is imported, or inside the `init` hook. Foundry logs it to
  the console and then carries on with its own default sheets, which is exactly what a broken
  system looks like from the outside -- documents render, sheets do not.

  The `foundry` global here is a stub: just enough shape for the imports to resolve and for
  init to run. It proves the module LOADS. It cannot prove the sheets are correct.
*/
const out = document.getElementById('out');
const log = (cls, msg) => {
  const pre = document.createElement('pre');
  pre.className = cls;
  pre.textContent = msg;
  out.appendChild(pre);
};
const head = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };

// --- the stub -------------------------------------------------------------
const fieldProblems = [];

class StubField { constructor(o = {}) { this.options = o; } }

/*
  StringField refuses the empty string unless `blank: true`, however the choices are
  written -- listing '' in `choices` is not enough. Getting that wrong throws
  "may not be a blank string" the moment a document carrying '' is created, which for a
  compendium item means it cannot be dragged onto a sheet at all.
*/
class StubStringField extends StubField {
  constructor(o = {}) {
    super(o);
    const choices = Array.isArray(o.choices) ? o.choices : Object.keys(o.choices ?? {});
    const allowsBlank = o.blank === true;
    if ((choices.includes('') || o.initial === '') && !allowsBlank) {
      fieldProblems.push(
        `StringField allows '' (choices: [${choices.map(c => `'${c}'`).join(', ')}]`
        + `, initial: '${o.initial ?? ''}') but is missing blank: true`);
    }
  }
}

class TypeDataModel {
  static defineSchema() { return {}; }
  constructor() {}
}

const mixin = (Base) => class extends Base {};

class ApplicationV2 {
  static DEFAULT_OPTIONS = {};
  constructor() {}
  render() {}
}
class DocumentSheetV2 extends ApplicationV2 {}
class ActorSheetV2 extends DocumentSheetV2 {}
class ItemSheetV2 extends DocumentSheetV2 {}

const registered = { sheets: [], settings: [], hooks: [] };

globalThis.foundry = {
  abstract: { TypeDataModel },
  data: { fields: new Proxy({}, { get: (_, name) => name === 'StringField' ? StubStringField : StubField }) },
  utils: { isEmpty: (o) => !o || !Object.keys(o).length, deepClone: structuredClone,
           getProperty: () => 0, mergeObject: Object.assign },
  applications: {
    api: { ApplicationV2, DocumentSheetV2, HandlebarsApplicationMixin: mixin,
           DialogV2: class { static async wait() {} static async confirm() {} } },
    sheets: { ActorSheetV2, ItemSheetV2 },
    handlebars: { renderTemplate: async () => '', loadTemplates: async () => ({}) },
    ux: { TextEditor: { implementation: { enrichHTML: async (s) => s } } },
  },
  appv1: { sheets: { ActorSheet: class {}, ItemSheet: class {} } },
  documents: { collections: {
    Actors: { registerSheet: (...a) => registered.sheets.push(a[1]?.name), unregisterSheet: () => {} },
    Items:  { registerSheet: (...a) => registered.sheets.push(a[1]?.name), unregisterSheet: () => {} },
  } },
};

globalThis.Actor = class { static implementation = class {}; };
globalThis.Item = class { static implementation = class {}; };
globalThis.Roll = class { constructor() {} async evaluate() { return this; } get total() { return 1; } };
globalThis.ChatMessage = class { static getSpeaker() { return {}; } static create() {} };
globalThis.CONFIG = { Actor: {}, Item: {}, controlIcons: {}, statusEffects: [], MARROW: null };
globalThis.ui = { notifications: { warn: () => {} } };
globalThis.game = {
  i18n: { localize: (k) => k, format: (k) => k },
  settings: { register: (ns, key) => registered.settings.push(`${ns}.${key}`), get: () => true },
  packs: { get: () => null },
  user: { can: () => true },
  system: { version: '0.0.0' },
};
const hooksRun = {};
globalThis.Hooks = {
  once: (name, fn) => { hooksRun[name] = fn; registered.hooks.push(`once:${name}`); },
  on: (name) => registered.hooks.push(`on:${name}`),
};
Math.clamp ??= (n, lo, hi) => Math.min(Math.max(n, lo), hi);
String.prototype.capitalize ??= function () { return this.charAt(0).toUpperCase() + this.slice(1); };

// Helpers Foundry supplies, stubbed so a render can happen here. The system's own helpers
// come from registerHelpers() during init and are NOT stubbed -- a missing one should fail.
Handlebars.registerHelper('localize', (k) => String(k));
Handlebars.registerHelper('numberFormat', (n, o) => (o?.hash?.sign && n > 0 ? `+${n}` : `${n}`));
Handlebars.registerHelper('checked', (v) => (v ? 'checked' : ''));

// --- run ------------------------------------------------------------------
(async () => {
  head('1. Import the module graph');
  let mod;
  try {
    // Cache-busted: dynamic import() caches by URL, so a fixed path would keep
    // reporting an error that has already been fixed.
    mod = await import(`../module/marrow.mjs?t=${Date.now()}`);
    log('ok', 'ok - every module imported without throwing');
  } catch (err) {
    log('bad', `FAILED at import time\n\n${err?.stack || err}`);
    log('warn', 'Foundry logs this to the console and then falls back to its own default\n'
              + 'sheets. Documents still work; nothing the system defines does.');
    return;
  }

  head('2. Run the init hook');
  try {
    await hooksRun.init?.();
    log('ok', 'ok - init completed');
  } catch (err) {
    log('bad', `FAILED inside the init hook\n\n${err?.stack || err}`);
    return;
  }

  head('3. What init registered');
  log('ok', `sheets   : ${registered.sheets.filter(Boolean).join(', ') || '(none)'}`);
  log('ok', `settings : ${registered.settings.join(', ') || '(none)'}`);
  log('ok', `hooks    : ${registered.hooks.join(', ')}`);
  log('ok', `data models: Actor [${Object.keys(CONFIG.Actor.dataModels || {})}] `
          + `Item [${Object.keys(CONFIG.Item.dataModels || {})}]`);

  head('4. Build every data model schema');
  const models = { ...(CONFIG.Actor.dataModels || {}), ...(CONFIG.Item.dataModels || {}) };
  for (const [name, cls] of Object.entries(models)) {
    try { cls.defineSchema(); }
    catch (err) { log('bad', `${name}.defineSchema() threw
  ${err.message}`); }
  }
  if (fieldProblems.length) {
    for (const p of fieldProblems) log('bad', p);
  } else {
    log('ok', `ok - ${Object.keys(models).length} schemas build, no blank-string traps`);
  }

  head('5. Compile every template');
  const templates = TEMPLATES;
  let bad = 0;
  for (const path of templates) {
    try {
      const text = await (await fetch(`../${path}?t=${Date.now()}`)).text();
      Handlebars.precompile(text);
    } catch (err) {
      bad++;
      log('bad', `${path}\n  ${err.message}`);
    }
  }
  if (!bad) log('ok', `ok - all ${templates.length} templates compile`);

  head('6. Render the wizard');
  /*
    Compiling only proves the syntax. Rendering with a realistic context is what catches a
    missing helper, a mis-shaped loop, or a partial that was never registered -- all of which
    compile fine and then throw the moment the window opens.
  */
  const ctx = {
    numbers: [{ group: 'stats', key: 'strength', label: 'Strength', formula: '2d10+25',
                value: 36, rolled: true },
               { group: 'root', key: 'silver', label: 'Silver', formula: '2d10 * 10',
                value: null, rolled: false }],
    allRolled: false,
    blockedBy: 'MARROW.Creation.RollEverythingFirst',
    canSubmit: false,
    isRegenerate: false,
    kit: [{ slot: 'loadout', label: 'Roll Loadout', text: null, rolled: false, available: false },
          { slot: 'trinket', label: 'Roll Trinket', text: 'A cat', rolled: true, available: true }],
    classes: [{ id: 'a', name: 'The Soldier', img: 'x.svg', selected: true,
                summary: '+10 Combat' }],
    chosenClass: { name: 'The Soldier', skillsNote: '<p>Soldiering</p>', granted: [],
                   choice: { amount: 5, isPenalty: false,
                             options: [{ key: 'combat', label: 'Combat', selected: true }] } },
    skillsByRank: { trained: [{ name: 'Athletics', bonus: 10, prerequisites: [],
                                granted: false, chosen: false, locked: false, available: true }],
                    expert: [], master: [] },
    preview: { stats: { strength: { value: 36, total: 36 } },
               saves: { sanity: { value: 20, total: 20 } },
               health: 18, wounds: 2, stress: 2, blight: 0, silver: 100 },
  };
  try {
    const text = await (await fetch(`../templates/dialog/creation.hbs?t=${Date.now()}`)).text();
    const html = Handlebars.compile(text)(ctx);
    const hasSubmit = /type=\"submit\"/.test(html);
    log(hasSubmit ? 'ok' : 'bad',
        hasSubmit ? 'ok - renders, and has a submit button'
                  : 'renders, but there is NO submit button -- nothing to apply');
  } catch (err) {
    log('bad', `creation.hbs threw while rendering
  ${err.message}`);
  }

  head('7. Render the Check dialogs');
  /*
    check.hbs and class-choice.hbs are what every Stat, Save, Skill, and weapon attack
    renders before rolling -- a missing helper here (like `selected`, added for the Skill
    dropdown) throws the moment a player clicks a weapon, not at compile time, and step 5's
    precompile does not execute the template far enough to notice.
  */
  const checkCtx = {
    key: 'combat', label: 'Combat Check', base: 42,
    rollable: [], skills: [{ id: 's1', name: 'Athletics', bonus: 10,
                              rankLabel: 'Trained', checked: false }],
    innate: true,
    given: [{ source: 'Longsword vs. Soft', effect: 'advantage', mark: '[+]' }],
  };
  const classChoiceCtx = {
    classItem: { name: 'The Scholar' }, amount: 5, isPenalty: false,
    options: [{ key: 'intellect', label: 'Intellect', value: 40 }],
  };
  for (const [path, ctx] of [['templates/dialog/check.hbs', checkCtx],
                             ['templates/dialog/class-choice.hbs', classChoiceCtx]]) {
    try {
      const text = await (await fetch(`../${path}?t=${Date.now()}`)).text();
      Handlebars.compile(text)(ctx);
      log('ok', `ok - ${path} renders`);
    } catch (err) {
      log('bad', `${path} threw while rendering\n  ${err.message}`);
    }
  }

  head('8. Render the Creature sheet');
  // Registered as a real Handlebars partial, the same way preloadTemplates() does in
  // Foundry itself -- creature-body.hbs pulls it in with {{> "marrow.item-row"}}.
  Handlebars.registerPartial('marrow.item-row',
    await (await fetch(`../templates/actor/parts/item-row.hbs?t=${Date.now()}`)).text());

  const creatureCtx = {
    system: {
      combat: { label: 'Combat', value: 30, total: 30 },
      instinct: { label: 'Instinct', value: 25, total: 25 },
      health: { value: 10, max: 10 }, wounds: { value: 0, max: 2, dead: false },
      armor: { points: 1, damageReduction: 0, kind: 'soft' }, bleeding: 0,
      biography: '', notes: '',
    },
    armorKindLabel: 'Soft', enrichedBiography: '', enrichedNotes: '',
    items: { weapon: [], armor: [] }, activeTab: 'arms',
  };
  for (const path of ['templates/actor/creature-header.hbs', 'templates/actor/creature-resources.hbs',
                       'templates/actor/creature-numbers.hbs', 'templates/actor/creature-body.hbs']) {
    try {
      const text = await (await fetch(`../${path}?t=${Date.now()}`)).text();
      Handlebars.compile(text)({ actor: { img: 'x.svg', name: 'Rat' }, ...creatureCtx });
      log('ok', `ok - ${path} renders`);
    } catch (err) {
      log('bad', `${path} threw while rendering\n  ${err.message}`);
    }
  }
})();
</script>
<script>
// Written out rather than globbed, because a static page cannot list a directory.
const TEMPLATES = [
  'templates/actor/header.hbs', 'templates/actor/resources.hbs', 'templates/actor/numbers.hbs',
  'templates/actor/nav.hbs', 'templates/actor/body.hbs', 'templates/actor/parts/item-row.hbs',
  'templates/actor/companion-header.hbs', 'templates/actor/companion-numbers.hbs',
  'templates/actor/companion-body.hbs',
  'templates/actor/creature-header.hbs', 'templates/actor/creature-resources.hbs',
  'templates/actor/creature-numbers.hbs', 'templates/actor/creature-body.hbs',
  'templates/item/header.hbs', 'templates/item/body.hbs',
  'templates/chat/check.hbs', 'templates/chat/panic.hbs', 'templates/chat/damage.hbs',
  'templates/chat/damage-applied.hbs', 'templates/chat/death.hbs', 'templates/chat/item.hbs',
  'templates/dialog/check.hbs', 'templates/dialog/class-choice.hbs',
  'templates/dialog/creation.hbs',
];
</script>
